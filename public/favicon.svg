<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272A" />
      <stop offset="1" stop-color="#09090B" />
    </linearGradient>
  </defs>

  <!-- Rounded tile + faint inner ring for depth -->
  <rect width="64" height="64" rx="15" fill="url(#mm-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none"
    stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5" />

  <!-- Monoline "MM" peaks — one continuous stroke -->
  <path d="M12 44 L12 20 L22 32 L32 20 L42 32 L52 20 L52 44"
    fill="none" stroke="#FFFFFF" stroke-width="4.5"
    stroke-linejoin="round" stroke-linecap="round" />
</svg>
